name: Frontend CI/CD

on:
  push:
    branches:
      - main   # main 브랜치에 push될 때 실행됨

jobs:
  hello:
    name: Hello World Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Say Hello
        run: echo "🎉 Hello GitHub Actions! Workflow is working!"

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: hello   # hello job 성공 후 실행
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: ./phanesVueLee

      - name: Build project
        run: npm run build
        working-directory: ./phanesVueLee

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync ./phanesVueLee/dist s3://${{ secrets.AWS_S3_BUCKET }} --delete
